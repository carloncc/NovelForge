[package]
name = "novelforge"
version = "0.2.0"
description = "AI 视觉小说转换工具"
edition = "2021"

[lib]
name = "novelforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tiny_http = "0.12"
mime_guess = "2"
base64 = "0.22"
chardetng = "0.1"
encoding_rs = "0.8"
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = "2"
# 内嵌 WebGAL 引擎模板，使便携版 exe 无需外部 templates 目录即可单独运行
include_dir = "0.7"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
opt-level = "s"
strip = true
# 4G 内存环境兼容：thin LTO + 多 codegen 单元（内存占用远低于 full LTO + 单单元）
lto = "thin"
codegen-units = 4
