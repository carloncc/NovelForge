[package]
name = "novelforge"
version = "0.1.0"
description = "AI 视觉小说转换工具"
edition = "2021"

[lib]
name = "novelforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tiny_http = "0.12"
mime_guess = "2"
base64 = "0.22"
chardetng = "0.1"
encoding_rs = "0.8"
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
