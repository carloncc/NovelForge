<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NovelForge 鉴赏室 · Appreciation Gallery</title>
<style>
  :root { --bg:#101014; --card:#1b1b22; --border:#2c2c36; --txt:#e8e8ee; --dim:#9a9aa8; --accent:#8b5cf6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .tabs { display: flex; gap: 8px; margin-left: auto; }
  .tab { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .lang { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--dim); cursor: pointer; font-size: 12px; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  /* 立绘鉴赏 */
  .stage { display: flex; gap: 20px; flex-wrap: wrap; }
  .stage-view { flex: 1 1 480px; background: repeating-conic-gradient(#1f1f27 0% 25%, #191921 0% 50%) 50% / 22px 22px; border: 1px solid var(--border); border-radius: 12px; min-height: 520px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .stage-view img { max-height: 96%; max-width: 96%; object-fit: contain; transition: transform .25s ease; user-select: none; }
  .stage-controls { flex: 1 1 280px; display: flex; flex-direction: column; gap: 12px; }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl label { font-size: 12px; color: var(--dim); }
  select, input[type="range"] { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: #15151b; color: var(--txt); font-size: 13px; }
  .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: #15151b; color: var(--txt); cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  /* 图鉴 / CG */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; height: 220px; object-fit: cover; background: repeating-conic-gradient(#1f1f27 0% 25%, #191921 0% 50%) 50% / 18px 18px; }
  .card .info { padding: 10px 12px; }
  .card .name { font-weight: 600; font-size: 14px; }
  .card .desc { color: var(--dim); font-size: 12px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .cg-img { cursor: pointer; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 50; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 94vw; max-height: 94vh; object-fit: contain; }
  .lightbox .close { position: absolute; top: 16px; right: 20px; font-size: 28px; cursor: pointer; color: var(--dim); }
  .bgm-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
  .bgm-row audio { flex: 1; height: 34px; }
  .empty { color: var(--dim); font-size: 13px; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>NovelForge <span class="sub" data-i18n="subtitle">鉴赏室 / Appreciation</span></h1>
  <div class="tabs">
    <button class="tab active" data-tab="figure" data-i18n="t-figure">立绘鉴赏</button>
    <button class="tab" data-tab="cg" data-i18n="t-cg">CG 画廊</button>
    <button class="tab" data-tab="char" data-i18n="t-char">角色图鉴</button>
    <button class="tab" data-tab="bgm" data-i18n="t-bgm">音乐鉴赏</button>
  </div>
  <button class="lang" id="langBtn">EN</button>
</header>

<main>
  <div class="panel active" id="panel-figure">
    <div class="stage">
      <div class="stage-view"><img id="figImg" alt="" /></div>
      <div class="stage-controls">
        <div class="ctl"><label data-i18n="c-char">角色</label><select id="figChar"></select></div>
        <div class="ctl"><label data-i18n="c-costume">服装</label><select id="figCostume"></select></div>
        <div class="ctl"><label data-i18n="c-emotion">表情</label><select id="figEmotion"></select></div>
        <div class="ctl"><label data-i18n="c-zoom">远近 / 缩放</label><input type="range" id="figZoom" min="50" max="200" value="100" /></div>
        <div class="ctl"><label><input type="checkbox" id="figBg" checked /> <span data-i18n="c-bg">显示背景色</span></label></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn" id="figPrev" data-i18n="c-prev">上一张</button>
          <button class="btn" id="figNext" data-i18n="c-next">下一张</button>
          <button class="btn" id="figFit" data-i18n="c-fit">复位</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-cg">
    <div class="grid" id="cgGrid"></div>
  </div>

  <div class="panel" id="panel-char">
    <div class="grid" id="charGrid"></div>
  </div>

  <div class="panel" id="panel-bgm">
    <div id="bgmList"></div>
  </div>
</main>

<div class="lightbox" id="lightbox"><span class="close" id="lbClose">&times;</span><img id="lbImg" alt="" /></div>

<script src="./appreciation-data.js"></script>
<script>
(function () {
  var D = window.APPRECIATION_DATA || { characters: [], cgs: [], bgms: [] };
  var I18N = {
    zh: { subtitle: "鉴赏室", "t-figure": "立绘鉴赏", "t-cg": "CG 画廊", "t-char": "角色图鉴", "t-bgm": "音乐鉴赏",
      "c-char": "角色", "c-costume": "服装", "c-emotion": "表情", "c-zoom": "远近 / 缩放", "c-bg": "显示背景色",
      "c-prev": "上一张", "c-next": "下一张", "c-fit": "复位", empty: "暂无内容", voice: "音色", desc: "简介", cloth: "服装" },
    en: { subtitle: "Appreciation", "t-figure": "Sprites", "t-cg": "CG Gallery", "t-char": "Character Encyclopedia", "t-bgm": "Music",
      "c-char": "Character", "c-costume": "Costume", "c-emotion": "Expression", "c-zoom": "Zoom", "c-bg": "Show background",
      "c-prev": "Previous", "c-next": "Next", "c-fit": "Reset", empty: "Nothing here yet", voice: "Voice", desc: "About", cloth: "Outfit" }
  };
  var lang = navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
  function applyLang(l) {
    lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = (I18N[l] && I18N[l][el.getAttribute("data-i18n")]) || el.textContent;
    });
    document.getElementById("langBtn").textContent = l === "zh" ? "EN" : "中";
    renderAll();
  }
  document.getElementById("langBtn").addEventListener("click", function () { applyLang(lang === "zh" ? "en" : "zh"); });

  /* ---- 立绘鉴赏 ---- */
  var figImg = document.getElementById("figImg");
  var selChar = document.getElementById("figChar");
  var selCostume = document.getElementById("figCostume");
  var selEmotion = document.getElementById("figEmotion");
  var zoom = document.getElementById("figZoom");
  var bgChk = document.getElementById("figBg");
  var figs = [];
  function figuresFor(char, costume, emotion) {
    var out = [];
    var base = char.id;
    var ctag = costume ? "_ct_" + costume : "";
    var etag = emotion && emotion !== "normal" ? "_" + emotion : "_normal";
    out.push("game/figure/figure_" + base + ctag + etag + ".png");
    return out;
  }
  function renderAll() {
    selChar.innerHTML = "";
    D.characters.forEach(function (c, i) {
      var o = document.createElement("option");
      o.value = i; o.textContent = c.name || c.id;
      selChar.appendChild(o);
    });
    if (D.characters.length) { selChar.value = 0; syncCostume(); }
    renderCg(); renderChars(); renderBgm();
  }
  function syncCostume() {
    var c = D.characters[selChar.value];
    if (!c) return;
    selCostume.innerHTML = "";
    var o = document.createElement("option"); o.value = ""; o.textContent = "默认";
    selCostume.appendChild(o);
    (c.costumes || []).forEach(function (ct) {
      var o2 = document.createElement("option"); o2.value = ct.id; o2.textContent = ct.name || ct.id;
      selCostume.appendChild(o2);
    });
    syncEmotion();
  }
  function syncEmotion() {
    var c = D.characters[selChar.value];
    if (!c) return;
    selEmotion.innerHTML = "";
    var emos = (c.emotions && c.emotions.length ? c.emotions : ["normal", "happy", "sad", "angry", "surprised"]);
    emos.forEach(function (e) {
      var o = document.createElement("option"); o.value = e; o.textContent = e;
      selEmotion.appendChild(o);
    });
    updateFig();
  }
  function updateFig() {
    var c = D.characters[selChar.value];
    if (!c) return;
    var files = figuresFor(c, selCostume.value, selEmotion.value);
    var src = files[0];
    var img = new Image();
    img.onload = function () { figImg.src = src; };
    img.onerror = function () { figImg.removeAttribute("src"); };
    img.src = src;
    figImg.style.transform = "scale(" + (zoom.value / 100) + ")";
  }
  selChar.addEventListener("change", syncCostume);
  selCostume.addEventListener("change", syncEmotion);
  selEmotion.addEventListener("change", updateFig);
  zoom.addEventListener("input", function () { figImg.style.transform = "scale(" + (zoom.value / 100) + ")"; });
  bgChk.addEventListener("change", function () {
    document.querySelector(".stage-view").style.background = bgChk.checked
      ? "repeating-conic-gradient(#1f1f27 0% 25%, #191921 0% 50%) 50% / 22px 22px"
      : "none";
  });
  document.getElementById("figPrev").addEventListener("click", function () {
    var idx = parseInt(selEmotion.value === "normal" ? "0" : "0", 10);
    var c = D.characters[selChar.value];
    if (!c) return;
    var emos = c.emotions && c.emotions.length ? c.emotions : ["normal", "happy", "sad", "angry", "surprised"];
    var i = Math.max(0, emos.indexOf(selEmotion.value) - 1);
    selEmotion.value = emos[i] || "normal"; updateFig();
  });
  document.getElementById("figNext").addEventListener("click", function () {
    var c = D.characters[selChar.value];
    if (!c) return;
    var emos = c.emotions && c.emotions.length ? c.emotions : ["normal", "happy", "sad", "angry", "surprised"];
    var i = Math.min(emos.length - 1, emos.indexOf(selEmotion.value) + 1);
    selEmotion.value = emos[i] || "normal"; updateFig();
  });
  document.getElementById("figFit").addEventListener("click", function () { zoom.value = 100; figImg.style.transform = "scale(1)"; });

  /* ---- CG 画廊 ---- */
  function renderCg() {
    var g = document.getElementById("cgGrid");
    g.innerHTML = "";
    if (!D.cgs.length) { g.innerHTML = '<div class="empty">' + (I18N[lang].empty) + "</div>"; return; }
    D.cgs.forEach(function (cg) {
      var div = document.createElement("div");
      div.className = "card";
      var img = document.createElement("img");
      img.className = "cg-img";
      img.src = "game/background/" + cg.file;
      img.alt = cg.name || "";
      img.addEventListener("click", function () {
        document.getElementById("lbImg").src = img.src;
        document.getElementById("lightbox").classList.add("open");
      });
      var info = document.createElement("div");
      info.className = "info";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = cg.name || cg.file;
      info.appendChild(name);
      div.appendChild(img); div.appendChild(info);
      g.appendChild(div);
    });
  }

  /* ---- 角色图鉴 ---- */
  function renderChars() {
    var g = document.getElementById("charGrid");
    g.innerHTML = "";
    if (!D.characters.length) { g.innerHTML = '<div class="empty">' + I18N[lang].empty + "</div>"; return; }
    D.characters.forEach(function (c) {
      var div = document.createElement("div");
      div.className = "card";
      var img = document.createElement("img");
      img.src = "game/figure/figure_" + c.id + "_normal.png";
      img.alt = c.name || "";
      img.addEventListener("click", function () {
        document.getElementById("lbImg").src = img.src;
        document.getElementById("lightbox").classList.add("open");
      });
      var info = document.createElement("div");
      info.className = "info";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = (c.name || c.id) + (c.isNpc ? " · NPC" : "");
      var desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = [I18N[lang].cloth + ": " + (c.clothing || ""), I18N[lang].desc + ": " + (c.appearance || "")].join("  ");
      info.appendChild(name); info.appendChild(desc);
      div.appendChild(img); div.appendChild(info);
      g.appendChild(div);
    });
  }

  /* ---- 音乐鉴赏 ---- */
  function renderBgm() {
    var g = document.getElementById("bgmList");
    g.innerHTML = "";
    if (!D.bgms.length) { g.innerHTML = '<div class="empty">' + I18N[lang].empty + "</div>"; return; }
    D.bgms.forEach(function (b) {
      var row = document.createElement("div");
      row.className = "bgm-row";
      var name = document.createElement("span");
      name.textContent = b.name || b.file;
      var audio = document.createElement("audio");
      audio.controls = true;
      audio.src = "game/bgm/" + b.file;
      row.appendChild(name); row.appendChild(audio);
      g.appendChild(row);
    });
  }

  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
      document.getElementById("panel-" + b.getAttribute("data-tab")).classList.add("active");
    });
  });
  document.getElementById("lbClose").addEventListener("click", function () {
    document.getElementById("lightbox").classList.remove("open");
  });
  document.getElementById("lightbox").addEventListener("click", function (e) {
    if (e.target === this) this.classList.remove("open");
  });
  applyLang(lang);
})();
</script>
</body>
</html>
