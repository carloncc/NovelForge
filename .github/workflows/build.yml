name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--bundles app dmg"
          - platform: ubuntu-22.04
            args: "--bundles deb appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fonts-noto-cjk fonts-noto-color-emoji

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install

      - name: Fetch WebGAL engine template
        run: pnpm prepare:template

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NovelForge ${{ github.ref_name }}"
          releaseBody: |
            NovelForge ${{ github.ref_name }}

            ## 安装包
            - **Windows**: `NovelForge_*-x64-setup.exe`（安装版）/ `NovelForge_*-x64_en-US.msi`
            - **macOS**: `NovelForge_*_aarch64.dmg` / `NovelForge_*_x64.dmg`
            - **Linux**: `.deb` / `.rpm` / `.AppImage`

            ## 使用
            1. 首次运行前需配置 API（文本 LLM 必填，图像/TTS 可选）
            2. 导入小说 → 生成 → 预览 → 导出
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
